openapi: 3.0.1
info:
  title: LMS Parent API
  version: 1.0.0
  description: >-
    Parent Phase 1 contracts. Authored YAML (not a springdoc group).
    Parent responses are allow-lists: no clientMessageId, object keys, checksum,
    version, CAS, link watermarks, or private notes.
servers:
- url: /api
  description: Servlet context-path
security:
- bearerAuth: []
tags:
- name: Counsellor Parent Links
- name: Tenant Parent Links
- name: Advisor Parent Links
- name: Parent Academic Reads
- name: ParentScheduleRequests
- name: Parent Reports
- name: Parent Notifications
- name: ParentConversations
paths:
  /v2/counsellor/student-intakes/{intakeId}/parent-links:
    get:
      operationId: counsellorListParentLinks
      tags: [Counsellor Parent Links]
      parameters:
      - $ref: "#/components/parameters/IntakeId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkListApiResponse" }
        "401":
          description: INVALID_TOKEN
        "403":
          description: "FORBIDDEN, ACCESS_DENIED"
        "404":
          description: STUDENT_INTAKE_NOT_FOUND
    post:
      operationId: counsellorCreateOrReuseParentLink
      tags: [Counsellor Parent Links]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/IntakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrReuseParentLinkRequest" }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkApiResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "STUDENT_INTAKE_NOT_FOUND, NOT_FOUND"
        "409":
          description: "CONFLICT, IDEMPOTENCY_KEY_MISMATCH"
  /v2/counsellor/student-intakes/{intakeId}/parent-links/{parentUserId}:
    put:
      operationId: counsellorLinkExistingParent
      tags: [Counsellor Parent Links]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/IntakeId"
      - $ref: "#/components/parameters/ParentUserId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkParentRequest" }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "STUDENT_INTAKE_NOT_FOUND, NOT_FOUND"
        "409":
          description: "CONFLICT, IDEMPOTENCY_KEY_MISMATCH"
    delete:
      operationId: counsellorUnlinkParent
      tags: [Counsellor Parent Links]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/IntakeId"
      - $ref: "#/components/parameters/ParentUserId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlinkParentRequest" }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "STUDENT_INTAKE_NOT_FOUND, NOT_FOUND"
        "409":
          description: "IDEMPOTENCY_KEY_MISMATCH"
  /v2/tenant/students/{studentUserId}/parent-links:
    get:
      operationId: tenantListParentLinks
      tags: [Tenant Parent Links]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkListApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
    post:
      operationId: tenantCreateOrReuseParentLink
      tags: [Tenant Parent Links]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrReuseParentLinkRequest" }
      responses:
        "200":
          description: Linked or reused Parent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
        "409":
          description: CONFLICT
  /v2/tenant/students/{studentUserId}/parent-links/{parentUserId}:
    put:
      operationId: tenantLinkParent
      tags: [Tenant Parent Links]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/StudentUserId"
      - $ref: "#/components/parameters/ParentUserId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkParentRequest" }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
        "409":
          description: "CONFLICT, IDEMPOTENCY_KEY_MISMATCH"
    delete:
      operationId: tenantUnlinkParent
      tags: [Tenant Parent Links]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/StudentUserId"
      - $ref: "#/components/parameters/ParentUserId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlinkParentRequest" }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
        "409":
          description: "IDEMPOTENCY_KEY_MISMATCH"
  /v2/advisor/students/{studentUserId}/parent-links:
    get:
      operationId: advisorListParentLinks
      tags: [Advisor Parent Links]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentLinkListApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/linked-students:
    get:
      operationId: parentListLinkedStudents
      tags: [Parent Academic Reads]
      parameters:
      - name: page
        in: query
        schema: { type: integer, default: 0, minimum: 0 }
      - name: size
        in: query
        schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentSummaryPageApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/parent/students/{studentUserId}/dashboard:
    get:
      operationId: parentGetStudentDashboard
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentDashboardApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/profile:
    get:
      operationId: parentGetStudentProfile
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentProfileApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/study-plan:
    get:
      operationId: parentGetStudentStudyPlan
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudyPlanApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/courses:
    get:
      operationId: parentListStudentCourses
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentCourseListApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/assignments:
    get:
      operationId: parentListStudentAssignments
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentAssignmentListApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/calendar:
    get:
      operationId: parentListStudentCalendar
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - name: from
        in: query
        description: Inclusive local date. Defaults to tenant today.
        schema: { type: string, format: date }
      - name: to
        in: query
        description: Exclusive local date. Defaults to from + 14 days. Window is 1-90 days.
        schema: { type: string, format: date }
      - name: timezone
        in: query
        description: IANA timezone. Defaults to the Student tenant timezone.
        schema: { type: string }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentCalendarApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/attendance:
    get:
      operationId: parentListStudentAttendance
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentAttendanceListApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/hours:
    get:
      operationId: parentGetStudentHours
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentHoursApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/risk:
    get:
      operationId: parentGetStudentRisk
      tags: [Parent Academic Reads]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentPublicRiskApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/reports:
    get:
      operationId: parentListStudentReports
      tags: [Parent Reports]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - name: page
        in: query
        schema: { type: integer, default: 0, minimum: 0 }
      - name: size
        in: query
        schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentReportPageApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/reports/{reportId}:
    get:
      operationId: parentGetStudentReport
      tags: [Parent Reports]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - name: reportId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentReportDetailApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/students/{studentUserId}/schedule-requests:
    get:
      operationId: listParentScheduleRequests
      tags: [ParentScheduleRequests]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentScheduleRequestListApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
    post:
      operationId: createParentScheduleRequest
      tags: [ParentScheduleRequests]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentCreateScheduleRequest" }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentScheduleRequestApiResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
        "409":
          description: "SCHEDULE_REQUEST_IDEMPOTENCY_MISMATCH, IDEMPOTENCY_KEY_MISMATCH"
  /v2/parent/notifications:
    get:
      operationId: parentListNotifications
      tags: [Parent Notifications]
      parameters:
      - name: page
        in: query
        schema: { type: integer, default: 0, minimum: 0 }
      - name: size
        in: query
        schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentNotificationPageApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/parent/notifications/unread-count:
    get:
      operationId: parentNotificationUnreadCount
      tags: [Parent Notifications]
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentUnreadCountApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/parent/notifications/{notificationId}/read:
    patch:
      operationId: parentMarkNotificationRead
      tags: [Parent Notifications]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - name: notificationId
        in: path
        required: true
        schema: { type: integer }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
  /v2/parent/notifications/read-all:
    patch:
      operationId: parentMarkAllNotificationsRead
      tags: [Parent Notifications]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentUnreadCountApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/parent/students/{studentUserId}/conversation/messages:
    get:
      operationId: parentListConversationMessages
      tags: [ParentConversations]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - name: beforeId
        in: query
        schema: { type: integer, format: int64 }
      - name: size
        in: query
        schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentConversationCursorApiResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "NOT_FOUND, CONVERSATION_NOT_FOUND"
    post:
      operationId: parentSendConversationMessage
      tags: [ParentConversations]
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SendParentMessageMultipart" }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentConversationMessageApiResponse" }
        "400":
          description: "UNSUPPORTED_FILE_TYPE, FILE_TOO_LARGE, PARAM_MISSING or BAD_REQUEST"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_FOUND
        "409":
          description: "IDEMPOTENCY_KEY_MISMATCH"
  /v2/parent/students/{studentUserId}/conversation/read:
    post:
      operationId: parentMarkConversationRead
      tags: [ParentConversations]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkConversationReadRequest" }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "NOT_FOUND, CONVERSATION_NOT_FOUND"

  /v2/parent/students/{studentUserId}/conversation/attachments/{attachmentId}/preview:
    get:
      operationId: parentPreviewConversationAttachment
      tags: [ParentConversations]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Preview stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: UNSUPPORTED_FILE_TYPE
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "NOT_FOUND, CONVERSATION_NOT_FOUND"
  /v2/parent/students/{studentUserId}/conversation/attachments/{attachmentId}/download:
    get:
      operationId: parentDownloadConversationAttachment
      tags: [ParentConversations]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Download stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "NOT_FOUND, CONVERSATION_NOT_FOUND"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required idempotency key for safe retries of this mutating request
      schema: { type: string, maxLength: 128 }
    IntakeId:
      name: intakeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StudentUserId:
      name: studentUserId
      in: path
      required: true
      schema: { type: integer }
    ParentUserId:
      name: parentUserId
      in: path
      required: true
      schema: { type: integer }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    BadRequest:
      description: PARAM_MISSING or BAD_REQUEST
    Unauthorized:
      description: INVALID_TOKEN
    Forbidden:
      description: FORBIDDEN
  schemas:
    CreateOrReuseParentLinkRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
        name: { type: string, maxLength: 100, description: "Legacy alias; non-blank is rejected" }

        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: CONVERSATION_NOT_FOUND
  /v2/student/advisor-conversation/attachments/{attachmentId}/download:
    get:
      operationId: studentDownloadAdvisorConversationAttachment
      tags: [StudentAdvisorConversation]
      parameters:
      - name: attachmentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Download stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: CONVERSATION_NOT_FOUND
  /v2/student/advisor-conversation/read:
    post:
      operationId: studentMarkAdvisorConversationRead
      tags: [StudentAdvisorConversation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkConversationReadRequest"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v2/advisor/action-tasks:
    get:
      operationId: advisorListActionTasks
      tags: [AdvisorActionTasks]
      parameters:
      - name: page
        in: query
        schema: { type: integer }
      - name: size
        in: query
        schema: { type: integer }
      - name: status
        in: query
        schema: { type: string, enum: [PENDING, IN_PROGRESS, RESOLVED] }
      - name: priority
        in: query
        schema: { type: string, enum: [HIGH, MEDIUM, LOW] }
      - name: type
        in: query
        schema: { type: string }
      - name: studentType
        in: query
        schema: { type: string, enum: [VIP, STANDARD] }
      - name: studentUserId
        in: query
        schema: { type: integer }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorActionTaskPageApiResponse"
        "400":
          description: "PARAM_MISSING or BAD_REQUEST"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/advisor/action-tasks/{taskId}:
    get:
      operationId: advisorGetActionTask
      tags: [AdvisorActionTasks]
      parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorActionTaskApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: ACTION_TASK_NOT_FOUND
  /v2/advisor/action-tasks/{taskId}/start:
    post:
      operationId: advisorStartActionTask
      tags: [AdvisorActionTasks]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, maxLength: 128 }
      - name: taskId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionTaskMutationRequest"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorActionTaskApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: ACTION_TASK_NOT_FOUND
        "409":
          description: "ACTION_TASK_STATE_CONFLICT, ACTION_TASK_VERSION_CONFLICT, IDEMPOTENCY_KEY_MISMATCH"
  /v2/advisor/action-tasks/{taskId}/resolve:
    post:
      operationId: advisorResolveActionTask
      tags: [AdvisorActionTasks]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, maxLength: 128 }
      - name: taskId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionTaskMutationRequest"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorActionTaskApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: ACTION_TASK_NOT_FOUND
        "409":
          description: "ACTION_TASK_STATE_CONFLICT, ACTION_TASK_VERSION_CONFLICT, IDEMPOTENCY_KEY_MISMATCH"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    IntakeId:
      name: intakeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StudentUserId:
      name: studentUserId
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
  responses:
    BadRequest:
      description: PARAM_MISSING or BAD_REQUEST
    Unauthorized:
      description: INVALID_TOKEN
    Forbidden:
      description: FORBIDDEN
    NotFound:
      description: STUDENT_INTAKE_NOT_FOUND or ADVISOR_ASSIGNMENT_NOT_FOUND or STUDENT_PROFILE_NOT_FOUND or STUDY_PLAN_NOT_FOUND or hidden cross-tenant/owner
  schemas:
    CreateStudentIntakeRequest:
      type: object
      required: [firstName, lastName, email, studentType, courseRequest]
      properties:
        name: { type: string, deprecated: true, description: Rejected when non-blank. Use firstName and lastName. }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        middleName: { type: string, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, maxLength: 255 }
        studentType: { type: string, enum: [VIP, STANDARD] }
        courseRequest: { type: string, minLength: 1, maxLength: 2000 }
        contactPhone: { type: string, minLength: 7, maxLength: 64 }
        basicBackground: { type: string, maxLength: 4000 }
    PatchStudentIntakeRequest:
      type: object
      required: [expectedIntakeVersion]
      description: email, role, level and tenantId are not accepted. At least one mutable field besides expectedIntakeVersion is required.
      properties:
        expectedIntakeVersion: { type: integer }
        name: { type: string, deprecated: true, description: Rejected when non-blank. Use firstName and lastName. }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        middleName: { type: string, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        studentType: { type: string, enum: [VIP, STANDARD] }
        courseRequest: { type: string, maxLength: 2000 }
        contactPhone: { type: string, minLength: 7, maxLength: 64 }
        basicBackground: { type: string, maxLength: 4000 }
    AssignAdvisorRequest:
      type: object
      required: [advisorUserId, expectedIntakeVersion]
      properties:
        advisorUserId: { type: integer }
        expectedIntakeVersion: { type: integer }
    ReassignAdvisorRequest:
      type: object
      required: [advisorUserId, expectedAssignmentVersion]
      properties:
        advisorUserId: { type: integer }
        expectedAssignmentVersion: { type: integer }
        reason: { type: string, maxLength: 1000 }
    CancelStudentIntakeRequest:
      type: object
      required: [expectedIntakeVersion, reason]
      properties:
        expectedIntakeVersion: { type: integer }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    StudentIntakeResponse:
      type: object
      required: [intakeId, studentUserId, lifecycleStatus, assignmentStatus, intakeVersion, activationMethod]
      properties:
        intakeId: { type: integer, format: int64 }
        studentUserId: { type: integer }
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        email: { type: string }
        studentType: { type: string, enum: [VIP, STANDARD] }
        courseRequest: { type: string }
        contactPhone: { type: string }
        basicBackground: { type: string }
        lifecycleStatus: { type: string, enum: [OPEN, CANCELLED] }
        assignmentStatus: { type: string, enum: [UNASSIGNED, ASSIGNED] }
        intakeVersion: { type: integer }
        activationMethod: { type: string, enum: [PASSWORD_RESET] }
        advisorUserId: { type: integer }
        assignmentVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdvisorCandidateResponse:
      type: object
      required: [advisorUserId, firstName, lastName, email, level]
      properties:
        advisorUserId: { type: integer }
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        email: { type: string }
        level: { type: string, enum: [ADVISOR, INSTRUCTOR_ADVISOR] }
    CounsellorDashboardResponse:
      type: object
      required: [createdCount, assignedCount, unassignedCount]
      properties:
        createdCount: { type: integer, format: int64 }
        assignedCount: { type: integer, format: int64 }
        unassignedCount: { type: integer, format: int64 }
    AdvisorStudentSummaryResponse:
      type: object
      required: [studentUserId, firstName, lastName, email, studentType, assignmentVersion]
      properties:
        studentUserId: { type: integer }
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        email: { type: string }
        studentType: { type: string, enum: [VIP, STANDARD] }
        assignmentVersion: { type: integer }
        targetGoal: { type: string }
        riskStatus: { type: string, enum: [ON_TRACK, AT_RISK, NEEDS_ATTENTION] }
        riskReasons:
          type: array
          items: { type: string }
        lastActivityAt: { type: string, format: date-time }
        highestPriority: { type: string, enum: [HIGH, MEDIUM, LOW] }
    AdvisingPageStudentIntake:
      type: object
      required: [page, size, total, items]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/StudentIntakeResponse" }
    AdvisingPageAdvisorCandidate:
      type: object
      required: [page, size, total, items]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdvisorCandidateResponse" }
    AdvisingPageAdvisorStudent:
      type: object
      required: [page, size, total, items]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdvisorStudentSummaryResponse" }
    StudentIntakeApiResponse:
      type: object
      required: [status, code, data]
      properties:
        status: { type: integer, example: 200 }
        code: { type: string, example: SUCCESS }
        data: { $ref: "#/components/schemas/StudentIntakeResponse" }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    CounsellorDashboardApiResponse:
      type: object
      required: [status, code, data]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    IntakeId:
      name: intakeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StudentUserId:
      name: studentUserId
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
  responses:
    BadRequest:
      description: PARAM_MISSING or BAD_REQUEST
    Unauthorized:
      description: UNAUTHORIZED
    Forbidden:
      description: FORBIDDEN
    NotFound:
      description: STUDENT_INTAKE_NOT_FOUND or ADVISOR_ASSIGNMENT_NOT_FOUND or STUDENT_PROFILE_NOT_FOUND or STUDY_PLAN_NOT_FOUND or hidden cross-tenant/owner
  schemas:
    CreateStudentIntakeRequest:
      type: object
      required: [name, email, studentType, courseRequest]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, maxLength: 255 }
        studentType: { type: string, enum: [VIP, STANDARD] }
        courseRequest: { type: string, minLength: 1, maxLength: 2000 }
        contactPhone: { type: string, minLength: 7, maxLength: 64 }
        basicBackground: { type: string, maxLength: 4000 }
    PatchStudentIntakeRequest:
      type: object
      required: [expectedIntakeVersion]
      description: email, role, level and tenantId are not accepted. At least one mutable field besides expectedIntakeVersion is required.
      properties:
        expectedIntakeVersion: { type: integer }
        name: { type: string, minLength: 1, maxLength: 255 }
        studentType: { type: string, enum: [VIP, STANDARD] }
        courseRequest: { type: string, maxLength: 2000 }
        contactPhone: { type: string, minLength: 7, maxLength: 64 }
        basicBackground: { type: string, maxLength: 4000 }
    AssignAdvisorRequest:
      type: object
      required: [advisorUserId, expectedIntakeVersion]
      properties:
        advisorUserId: { type: integer }
        expectedIntakeVersion: { type: integer }
    ReassignAdvisorRequest:
      type: object
      required: [advisorUserId, expectedAssignmentVersion]
      properties:
        advisorUserId: { type: integer }
        expectedAssignmentVersion: { type: integer }
        reason: { type: string, maxLength: 1000 }
    CancelStudentIntakeRequest:
      type: object
      required: [expectedIntakeVersion, reason]
      properties:
        expectedIntakeVersion: { type: integer }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    StudentIntakeResponse:
      type: object
      required: [intakeId, studentUserId, lifecycleStatus, assignmentStatus, intakeVersion]
      properties:
        intakeId: { type: integer, format: int64 }
        studentUserId: { type: integer }
        name: { type: string }
        email: { type: string }
        studentType: { type: string, enum: [VIP, STANDARD] }
        courseRequest: { type: string }
        contactPhone: { type: string }
        basicBackground: { type: string }
        lifecycleStatus: { type: string, enum: [OPEN, CANCELLED] }
        assignmentStatus: { type: string, enum: [UNASSIGNED, ASSIGNED] }
        intakeVersion: { type: integer }
        activationMethod: { type: string, enum: [PASSWORD_RESET] }
        advisorUserId: { type: integer }
        assignmentVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdvisorCandidateResponse:
      type: object
      required: [advisorUserId, name, email, level]
      properties:
        advisorUserId: { type: integer }
        name: { type: string }
        email: { type: string }
        level: { type: string, enum: [ADVISOR, INSTRUCTOR_ADVISOR] }
    CounsellorDashboardResponse:
      type: object
      required: [createdCount, assignedCount, unassignedCount]
      properties:
        createdCount: { type: integer, format: int64 }
        assignedCount: { type: integer, format: int64 }
        unassignedCount: { type: integer, format: int64 }
    AdvisorStudentSummaryResponse:
      type: object
      required: [studentUserId, name, email, studentType, assignmentVersion]
      properties:
        studentUserId: { type: integer }
        name: { type: string }
        email: { type: string }
        studentType: { type: string, enum: [VIP, STANDARD] }
        assignmentVersion: { type: integer }
    AdvisingPageStudentIntake:
      type: object
      required: [page, size, total, items]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/StudentIntakeResponse" }
    AdvisingPageAdvisorCandidate:
      type: object
      required: [page, size, total, items]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdvisorCandidateResponse" }
    AdvisingPageAdvisorStudent:
      type: object
      required: [page, size, total, items]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdvisorStudentSummaryResponse" }
    StudentIntakeApiResponse:
      type: object
      required: [status, code, data]
      properties:
        status: { type: integer, example: 200 }
        code: { type: string, example: SUCCESS }
        data: { $ref: "#/components/schemas/StudentIntakeResponse" }
        message: { type: string }
        timestamp: { type: string, format: date-time }

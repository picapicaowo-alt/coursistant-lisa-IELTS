        status: { type: integer, example: 200 }
        code: { type: string, example: SUCCESS }
        data: { $ref: "#/components/schemas/CounsellorDashboardResponse" }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    StudentIntakePageApiResponse:
      type: object
      properties:
        status: { type: integer }

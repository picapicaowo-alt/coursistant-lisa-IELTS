openapi: 3.0.1
info:
  title: LMS Advising API
  version: 1.0.0
  description: >-
    Gate A/B advising contracts plus Gate C course orchestration contracts.
    Counsellor Intake standalone copy: counsellor.openapi.yaml.
servers:
- url: /api
  description: Servlet context-path
security:
- bearerAuth: []
tags:
- name: CounsellorIntakes
- name: AdvisorStudents
- name: AdvisorProfiles
- name: AdvisorStudyPlans
- name: StudentProfiles
- name: TenantIntakes
- name: TenantProfiles
- name: AdvisorCourses
- name: TenantCourseConfig
- name: InstructorContext
paths:
  /v2/counsellor/student-intakes:
    post:
      operationId: counsellorCreateStudentIntake
      tags: [CounsellorIntakes]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentIntakeRequest"
      responses:
        "201":
          description: "HTTP 201. ApiResponse.status=201. ApiResponse.code=SUCCESS. Created USER/STUDENT plus OPEN UNASSIGNED intake."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakeApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "USER_ALREADY_EXISTS, ADVISING_FEATURE_DISABLED, IDEMPOTENCY_KEY_MISMATCH"
    get:
      operationId: counsellorListStudentIntakes
      tags: [CounsellorIntakes]
      parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: "HTTP 200. ApiResponse.status=200. ApiResponse.code=SUCCESS. Caller-owned unassigned OPEN intakes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakePageApiResponse"
        "400":
          description: PARAM_MISSING or BAD_REQUEST
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/counsellor/student-intakes/{intakeId}:
    get:
      operationId: counsellorGetStudentIntake
      tags: [CounsellorIntakes]
      parameters:
      - $ref: "#/components/parameters/IntakeId"
      responses:
        "200":
          description: "HTTP 200. ApiResponse.status=200. ApiResponse.code=SUCCESS. Caller-owned unassigned OPEN intake."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakeApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDENT_INTAKE_NOT_FOUND
    patch:
      operationId: counsellorPatchStudentIntake
      tags: [CounsellorIntakes]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 128
      - $ref: "#/components/parameters/IntakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStudentIntakeRequest"
      responses:
        "200":
          description: "HTTP 200. ApiResponse.status=200. ApiResponse.code=SUCCESS. Updated unassigned intake."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakeApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDENT_INTAKE_NOT_FOUND
        "409":
          description: "STUDENT_INTAKE_VERSION_CONFLICT, ADVISING_FEATURE_DISABLED, IDEMPOTENCY_KEY_MISMATCH"
  /v2/counsellor/advisors:
    get:
      operationId: counsellorListAdvisors
      tags: [CounsellorIntakes]
      parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: "HTTP 200. ApiResponse.status=200. ApiResponse.code=SUCCESS. Same-tenant ACTIVE ADVISOR or INSTRUCTOR_ADVISOR candidates."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorCandidatePageApiResponse"
        "400":
          description: PARAM_MISSING or BAD_REQUEST
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/counsellor/student-intakes/{intakeId}/advisor:
    put:
      operationId: counsellorAssignAdvisor
      tags: [CounsellorIntakes]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 128
      - $ref: "#/components/parameters/IntakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAdvisorRequest"
      responses:
        "200":
          description: "HTTP 200. ApiResponse.status=200. ApiResponse.code=SUCCESS. First assignment; assignmentVersion=0."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakeApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDENT_INTAKE_NOT_FOUND
        "409":
          description: "ADVISOR_NOT_ELIGIBLE, STUDENT_ALREADY_ASSIGNED, STUDENT_INTAKE_VERSION_CONFLICT, ADVISING_FEATURE_DISABLED, IDEMPOTENCY_KEY_MISMATCH"
  /v2/counsellor/dashboard:
    get:
      operationId: counsellorGetDashboard
      tags: [CounsellorIntakes]
      description: Read-only counsellor aggregates. Available even when intake-assignment-writes-enabled is false.
      responses:
        "200":
          description: "HTTP 200. ApiResponse.status=200. ApiResponse.code=SUCCESS."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounsellorDashboardApiResponse"
        "401":
          description: UNAUTHORIZED
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/advisor/students:
    get:
      operationId: advisorListStudents
      tags: [AdvisorStudents]
      parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Current assignment ACTIVE students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudentPageApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/advisor/students/{studentUserId}/intake:
    get:
      operationId: advisorGetStudentIntake
      tags: [AdvisorStudents]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: Intake readable by current advisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakeApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/tenant/student-intakes:
    get:
      operationId: tenantListStudentIntakes
      tags: [TenantIntakes]
      parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Size"
      - in: query
        name: lifecycleStatus
        schema: { type: string, enum: [OPEN, CANCELLED] }
      - in: query
        name: assignmentStatus
        schema: { type: string, enum: [UNASSIGNED, ASSIGNED] }
      - in: query
        name: advisorUserId
        schema: { type: integer }
      responses:
        "200":
          description: Tenant intakes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakePageApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v2/tenant/student-intakes/{intakeId}/advisor:
    put:
      operationId: tenantAssignAdvisor
      tags: [TenantIntakes]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 128
      - $ref: "#/components/parameters/IntakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAdvisorRequest"
      responses:
        "200":
          description: First assignment by TENANT_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakeApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "STUDENT_ALREADY_ASSIGNED, ADVISOR_NOT_ELIGIBLE, STUDENT_INTAKE_VERSION_CONFLICT, ADVISING_FEATURE_DISABLED"
  /v2/tenant/students/{studentUserId}/advisor:
    put:
      operationId: tenantReassignAdvisor
      tags: [TenantIntakes]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 128
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignAdvisorRequest"
      responses:
        "200":
          description: Reassignment or same-advisor no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakeApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "ADVISOR_ASSIGNMENT_VERSION_CONFLICT, ADVISOR_NOT_ELIGIBLE, ADVISING_FEATURE_DISABLED"
  /v2/tenant/student-intakes/{intakeId}/cancel:
    post:
      operationId: tenantCancelStudentIntake
      tags: [TenantIntakes]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 128
      - $ref: "#/components/parameters/IntakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelStudentIntakeRequest"
      responses:
        "200":
          description: Cancelled unassigned intake or repeat no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentIntakeApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "STUDENT_ALREADY_ASSIGNED, STUDENT_INTAKE_NOT_CANCELLABLE, STUDENT_INTAKE_VERSION_CONFLICT, ADVISING_FEATURE_DISABLED"
  /v2/advisor/students/{studentUserId}/profile:
    post:
      operationId: advisorCreateStudentProfile
      tags: [AdvisorProfiles]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, maxLength: 128 }
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentProfileRequest"
      responses:
        "201":
          description: Created profile with profileVersion=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudentProfileApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "STUDENT_PROFILE_ALREADY_EXISTS, STUDENT_INTAKE_REQUIRED, ADVISING_FEATURE_DISABLED, IDEMPOTENCY_KEY_MISMATCH"
    get:
      operationId: advisorGetStudentProfile
      tags: [AdvisorProfiles]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: Current Advisor full profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudentProfileApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDENT_PROFILE_NOT_FOUND or hidden non-owner
    put:
      operationId: advisorUpdateStudentProfile
      tags: [AdvisorProfiles]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, maxLength: 128 }
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentProfileRequest"
      responses:
        "200":
          description: Updated profile aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudentProfileApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "STUDENT_PROFILE_VERSION_CONFLICT, ADVISING_FEATURE_DISABLED, IDEMPOTENCY_KEY_MISMATCH"
  /v2/advisor/students/{studentUserId}/study-plan:
    post:
      operationId: advisorCreateStudyPlan
      tags: [AdvisorStudyPlans]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, maxLength: 128 }
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyPlanRequest"
      responses:
        "201":
          description: Created study plan with studyPlanVersion=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudyPlanApiResponse"
        "400":
          description: "STUDY_PLAN_INVALID_TIMELINE, STUDY_PLAN_CHILD_INVALID, BAD_REQUEST"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "STUDY_PLAN_ALREADY_EXISTS, STUDENT_PROFILE_REQUIRED, STUDENT_PROFILE_VERSION_CONFLICT, ADVISING_FEATURE_DISABLED, IDEMPOTENCY_KEY_MISMATCH"
    get:
      operationId: advisorGetStudyPlan
      tags: [AdvisorStudyPlans]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: Live profileContext plus current plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudyPlanApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDY_PLAN_NOT_FOUND or hidden non-owner
    put:
      operationId: advisorUpdateStudyPlan
      tags: [AdvisorStudyPlans]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, maxLength: 128 }
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudyPlanRequest"
      responses:
        "200":
          description: Updated study plan aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudyPlanApiResponse"
        "400":
          description: "STUDY_PLAN_INVALID_TIMELINE, STUDY_PLAN_CHILD_INVALID, BAD_REQUEST"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "STUDY_PLAN_VERSION_CONFLICT, STUDENT_PROFILE_VERSION_CONFLICT, ADVISING_FEATURE_DISABLED, IDEMPOTENCY_KEY_MISMATCH"
  /v2/advisor/students/{studentUserId}/study-plan/revisions:
    get:
      operationId: advisorListStudyPlanRevisions
      tags: [AdvisorStudyPlans]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Immutable revision metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanRevisionPageApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/student/profile:
    get:
      operationId: studentGetOwnProfile
      tags: [StudentProfiles]
      responses:
        "200":
          description: Own profile without advisorPrivateNotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentFacingProfileApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDENT_PROFILE_NOT_FOUND
  /v2/student/study-plan:
    get:
      operationId: studentGetOwnStudyPlan
      tags: [StudentProfiles]
      responses:
        "200":
          description: Own current study plan without advisorPrivateNotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentFacingStudyPlanApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDY_PLAN_NOT_FOUND
  /v2/tenant/students/{studentUserId}/profile:
    get:
      operationId: tenantGetStudentProfile
      tags: [TenantProfiles]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: Tenant-admin read profile without advisorPrivateNotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStudentProfileApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDENT_PROFILE_NOT_FOUND or hidden cross-tenant
  /v2/tenant/students/{studentUserId}/study-plan:
    get:
      operationId: tenantGetStudentStudyPlan
      tags: [TenantProfiles]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: Tenant-admin read current study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStudyPlanApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDY_PLAN_NOT_FOUND or hidden cross-tenant
  /v2/tenant/students/{studentUserId}/study-plan/revisions:
    get:
      operationId: tenantListStudyPlanRevisions
      tags: [TenantProfiles]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Tenant-admin revision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanRevisionPageApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/advisor/students/{studentUserId}/courses:
    get:
      operationId: advisorListStudentCourses
      tags: [AdvisorCourses]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudentCourseListApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDY_PLAN_NOT_FOUND
  /v2/advisor/students/{studentUserId}/course-options:
    get:
      operationId: advisorSearchGroupCourseOptions
      tags: [AdvisorCourses]
      parameters:
      - $ref: "#/components/parameters/StudentUserId"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupCourseOptionPageApiResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: STUDY_PLAN_NOT_FOUND
  /v2/advisor/students/{studentUserId}/courses/group-links:
    post:
      operationId: advisorLinkGroupCourse
      tags: [AdvisorCourses]
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, maxLength: 128 }
      - $ref: "#/components/parameters/StudentUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGroupCourseRequest"
      responses:
        "201":
          description: "HTTP 201, ApiResponse.status=201, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorStudentCourseApiResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "COURSE_NOT_FOUND, STUDY_PLAN_NOT_FOUND"
        "409":
          description: "STUDY_PLAN_VERSION_CONFLICT, COURSE_CAPACITY_FULL, CONFLICT, ADVISING_FEATURE_DISABLED, IDEMPOTENCY_KEY_MISMATCH"
  /v2/advisor/students/{studentUserId}/courses/{courseId}/withdraw:
    post:
      operationId: advisorWithdrawGroupCourse
      tags: [AdvisorCourses]
      description: Withdraw a Group Course link or a DRAFT/READY 1-on-1 Course. PUBLISHED 1-on-1 remains blocked.
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, maxLength: 128 }
      - $ref: "#/components/parameters/StudentUserId"
      - name: courseId
        in: path
        required: true
        schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawGroupCourseRequest"
      responses:
        "200":
          description: "HTTP 200, ApiResponse.status=200, ApiResponse.code=SUCCESS"
          content:
            application/json:
              schema:

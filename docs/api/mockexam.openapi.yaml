    post:
      operationId: uploadTenantMockExamMedia
      tags: [TenantMockExamTemplates]
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string }
      - in: path
        name: templateId
        required: true
        schema: { type: integer, format: int64 }
      - in: path
        name: versionId
        required: true
        schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [LISTENING_AUDIO, READING_IMAGE, WRITING_IMAGE] }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockExamMediaApiResponse"
        "400":
          description: BAD_REQUEST, UNSUPPORTED_FILE_TYPE, FILE_TOO_LARGE
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: MOCK_EXAM_NOT_FOUND }
        "409": { description: "MOCK_EXAM_CONTENT_LOCKED, IDEMPOTENCY_KEY_MISMATCH" }
        "503": { description: STORAGE_FAILURE }
    get:
      operationId: listTenantMockExamMedia
      tags: [TenantMockExamTemplates]
      parameters:
      - in: path
        name: templateId
        required: true
        schema: { type: integer, format: int64 }
      - in: path
        name: versionId
        required: true
        schema: { type: integer, format: int64 }
      - in: query
        name: status
        schema: { type: string, enum: [UPLOADED, BOUND] }
      responses:
        "200":
          description: Media list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockExamMediaListApiResponse"
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: MOCK_EXAM_NOT_FOUND }

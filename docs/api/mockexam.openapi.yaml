components:
  schemas:
    MockExamObjectiveAnswer:
      oneOf:
      - type: object
        required: [answer]
        properties:
          answer: {type: string}
        not: {required: [answers]}
      - type: object
        required: [answers]
        properties:
          answers: {type: array, items: {type: string}}
        not: {required: [answer]}
    MockExamAnswerBearingQuestionPayload:
      type: object
      description: Renderer-specific question content. Each non-multiSelect numbered slot requires exactly one answer string or answers string array of equivalent answers. multiSelect uses questionIds, chooseCount, options and answersByQuestion (question ID to one option key) and is graded as an unordered set. Matching trims outer whitespace and ignores case; punctuation, internal whitespace and word order remain significant. Numbers are strings.
      additionalProperties: true
    MockExamContentRevision:
      type: object
      required: [contentRevision]
      properties:
        contentRevision: {type: integer, format: int64, minimum: 0}
    ApiErrorResponse:
      type: object
      description: Error envelope rendered by ApiExceptionHandler (data is explicitly
        null unless structured error details are supplied).
      properties:
        code:
          type: string
          description: Stable ErrorType.name()
          example: USER_NOT_FOUND
        data:
          type: object
          nullable: true
        message:
          type: string
          example: User Does Not Exist
        status:
          type: integer
          format: int32
          example: 404
        timestamp:
          type: string
          format: date-time
          example: 2026-07-23T10:00:00Z
      required:
      - status
      - code
      - data
      - message
      - timestamp
    ApiResponse:
      type: object
      description: Unified JSON envelope for LMS APIs
      properties:
        code:
          type: string
          description: Stable machine code (ErrorType.name() or SUCCESS)
          example: SUCCESS
        data:
          $ref: "#/components/schemas/TemplateSummaryDto"
        message:
          type: string
          description: Human-readable message
          example: Success
        status:
          type: integer
          format: int32
          description: HTTP status mirrored in body
          example: 200
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp
          example: 2026-07-23T10:00:00Z
    AttemptDto:
      type: object
      properties:
        candidateName:
          type: string
        id:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        status:
          type: string
        studentMockExamId:
          type: integer
          format: int64
        studentUserId:
          type: integer
          format: int32
        submittedAt:
          type: string
          format: date-time
        testId:
          type: integer
          format: int64
    CopyVersionRequest:
      type: object
      properties:
        sourceVersionId:
          type: integer
          format: int64
    CreateListeningPartRequest:
      type: object
      required: [seq, label, audioMediaId, sections]
      properties:
        audioMediaId:
          type: integer
          format: int64
        label:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/CreateListeningSectionRequest"
        seq:
          type: integer
          format: int32
    CreateListeningRequest:
      type: object
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/CreateListeningPartRequest"
        totalMinutes:
          type: integer
          format: int32
    CreateListeningSectionRequest:
      type: object
      properties:
        instruction:
          type: string
        kind:
          type: string
        payload:
          $ref: "#/components/schemas/MockExamAnswerBearingQuestionPayload"
        questionEnd:
          type: integer
          format: int32
        questionStart:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        title:
          type: string
    CreatePassageQuestionRequest:
      type: object
      properties:
        imageMediaId:
          type: integer
          format: int64
        instruction:
          type: string
        kind:
          type: string
        payload:
          $ref: "#/components/schemas/MockExamAnswerBearingQuestionPayload"
        questionEnd:
          type: integer
          format: int32
        questionStart:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        title:
          type: string
    CreatePassageRequest:
      type: object
      properties:
        intro:
          type: string
        paragraphs:
          $ref: "#/components/schemas/JsonNode"

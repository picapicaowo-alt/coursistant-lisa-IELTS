components:
  schemas:
    ApiErrorResponse:
      type: object
      description: Error envelope rendered by ApiExceptionHandler (data is explicitly
        null unless structured error details are supplied).
      properties:
        code:
          type: string
          description: Stable ErrorType.name()
          example: USER_NOT_FOUND
        data:
          type: object
          nullable: true
        message:
          type: string
          example: User Does Not Exist
        status:
          type: integer
          format: int32
          example: 404
        timestamp:
          type: string
          format: date-time
          example: 2026-07-23T10:00:00Z
      required:
      - status
      - code
      - data
      - message
      - timestamp
    ApiResponse:
      type: object
      description: Unified JSON envelope for LMS APIs
      properties:
        code:
          type: string
          description: Stable machine code (ErrorType.name() or SUCCESS)
          example: SUCCESS
        data:
          $ref: "#/components/schemas/TemplateSummaryDto"
        message:
          type: string
          description: Human-readable message
          example: Success
        status:
          type: integer
          format: int32
          description: HTTP status mirrored in body
          example: 200
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp
          example: 2026-07-23T10:00:00Z

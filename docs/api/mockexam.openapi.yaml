# Scoped additions from ../backend-fix-adaptation-source-2026-09-05.md; preserve the existing contract.
openapi: 3.0.1
info:
  description: Coursistant LMS REST API contract (OpenAPI 3).
  title: LMS API
  version: 1.0.0
servers:
- description: Servlet context-path
  url: /api
security:
- bearerAuth: []
paths:
  /v2/tenant/mock-exam-templates/{templateId}/versions/{versionId}/writing/authoring:
    get:
      description: Authoring projection with answer keys, media IDs and version-wide contentRevision. Response-only IDs and preview URLs must not be copied into writes.
      parameters:
      - {in: path, name: templateId, required: true, schema: {type: integer, format: int64}}
      - {in: path, name: versionId, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Authoring content and contentRevision
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - {$ref: "#/components/schemas/CreateWritingRequest"}
                    - {$ref: "#/components/schemas/MockExamContentRevision"}
        "404": {description: MOCK_EXAM_SECTION_NOT_FOUND}
  /v2/tenant/mock-exam-templates/{templateId}/versions/{versionId}/listening/authoring:

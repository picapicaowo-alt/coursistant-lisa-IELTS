openapi: 3.0.1
info:
  description: Coursistant LMS REST API contract (OpenAPI 3).
  title: LMS API
  version: 1.0.0
servers:
- description: Servlet context-path
  url: /api
security:
- bearerAuth: []
tags:
- description: Student view of own released/unreleased assignment grades in a course
  name: MyGrades
- description: "PDF rubric upload, download, preview, and version restore"
  name: AssignmentRubrics
- description: Instructor/TA daily grading; grade release/retract is Instructor-only
  name: AssignmentGrading
- description: SYSTEM_ADMIN audited grade corrections (not daily grading)
  name: SystemGradeCorrections
- description: "Student staging, submit, and submission file access"
  name: AssignmentSubmissions
- description: Current-user cross-course assignment dashboard
  name: MeAssignments
- description: "Assignment CRUD, publish lifecycle, and authoritative graded-work\
    \ attachments"
  name: Assignments
paths:
  /v2/courses/{courseId}/assignment-attachments:
    get:
      description: "Returns attachment metadata only. No instructions, points, due\
        \ dates, grades, submissions, or roster data. Staff and AI ingest see Draft\
        \ and Published parents; students see Published only. Empty when the course\
        \ has no attachments."
      operationId: assignmentAttachmentManifest
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentAttachmentManifestApiResponse"
          description: SUCCESS
      summary: List assignment attachments in a course
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments:
    get:
      description: "Instructor/TA see all states including Draft. Students only see\
        \ Published; drafts are omitted. Student items are grouped OVERDUE, UPCOMING,\
        \ COMPLETED and include Lecture display, learningType, submission state, and\
        \ Released grade data only."
      operationId: assignmentList
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: List assignments in a course
      tags:
      - Assignments
    post:
      description: "Instructor only. dueAt/lateUntil are course-local wall-clock times\
        \ without Z, UTC offset, or fractional seconds. A same-course weekId (Lecture)\
        \ and learningType are required. Group assignments require submissionType=Group\
        \ and groupSetId."
      operationId: assignmentCreate
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "PARAM_MISSING, BAD_REQUEST, INVALID_LOCAL_TIME, ASSIGNMENT_FILE_CONSTRAINT_INVALID"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: WEEK_NOT_FOUND
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_GROUP_SET_REQUIRED
      summary: Create an assignment
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/summaries:
    get:
      description: "Any course member. Students only see Published and receive Lecture\
        \ display, learningType, submissionStatus, studentListGroup, and Released\
        \ score/feedback only."
      operationId: assignmentListSummaries
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: List slim assignment summary cards
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/{assignmentId}:
    delete:
      description: Instructor only. May fail when submissions already exist.
      operationId: assignmentDelete
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_HAS_SUBMISSIONS
      summary: Delete an assignment
      tags:
      - Assignments
    get:
      description: Instructor/TA may open Draft. Students receive ASSIGNMENT_NOT_FOUND
        for non-Published assignments. Staff get roster/grading counters; students
        get submission/grade view fields.
      operationId: assignmentGet
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND (including student access to Draft) or
            COURSE_NOT_FOUND
      summary: Get assignment detail
      tags:
      - Assignments
    patch:
      description: "Instructor only. Partial update; only non-null fields apply. Requires\
        \ expectedVersion. dueAt/lateUntil are course-local wall-clock times without\
        \ Z, UTC offset, or fractional seconds. Shortening due date may require confirmShortenDueDate=true."
      operationId: assignmentPatch
      parameters:
      - description: Required idempotency key for safe retries of this mutating request;
          also stored on the assignment audit row
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - description: Optional caller-declared audit marker. This does not replace
          the authenticated instructor identity.
        in: header
        name: X-Write-Origin
        schema:
          type: string
          example: ai-assistant
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]+$"
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAssignmentRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "PARAM_MISSING, BAD_REQUEST, INVALID_LOCAL_TIME, IDEMPOTENCY_KEY_REQUIRED"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND or WEEK_NOT_FOUND
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "ASSIGNMENT_TYPE_LOCKED, ASSIGNMENT_GROUP_SET_REQUIRED, ASSIGNMENT_DUE_SHORTEN_CONFIRM_REQUIRED,\
            \ ASSIGNMENT_HAS_SUBMISSIONS, ASSIGNMENT_VERSION_CONFLICT, IDEMPOTENCY_KEY_MISMATCH"
      summary: Patch an assignment
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/{assignmentId}/attachments:
    post:
      description: Instructor only. Multipart part `files` (array of binary files).
        All files required for submission or grading must use Assignment Attachments;
        Week Materials are general course resources and are not an authoritative representation
        of graded work.
      operationId: assignmentUploadAttachments
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: files
        required: false
        schema:
          type: array
          items:
            type: string
            format: binary
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "UNSUPPORTED_FILE_TYPE, FILE_TOO_LARGE, PARAM_MISSING"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND
      summary: Upload instructor attachments
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/{assignmentId}/attachments/{attachmentId}:
    delete:
      description: Instructor only.
      operationId: assignmentDeleteAttachment
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: attachmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND or attachment NOT_FOUND
      summary: Delete an instructor attachment
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/{assignmentId}/attachments/{attachmentId}/download:
    get:
      description: Course members with assignment visibility. Returns raw bytes (not
        JSON ApiResponse). Students cannot download attachments on Draft assignments
        (ASSIGNMENT_NOT_FOUND).
      operationId: assignmentDownloadAttachment
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: attachmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          description: Attachment bytes
          headers:
            Content-Disposition:
              description: attachment; filename="..."; filename*=UTF-8''...
              schema:
                type: string
                example: attachment; filename="brief.pdf"; filename*=UTF-8''brief.pdf
              style: simple
            Content-Type:
              description: "Stored content type, or application/octet-stream when\
                \ unknown"
              schema:
                type: string
                example: application/pdf
              style: simple
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND or attachment NOT_FOUND
      summary: Download an assignment attachment
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/{assignmentId}/attachments/{attachmentId}/preview:
    get:
      description: "Course members with assignment visibility. Returns raw bytes with\
        \ Content-Disposition: inline for PDF and images. Students cannot preview\
        \ attachments on Draft assignments (ASSIGNMENT_NOT_FOUND). Non-previewable\
        \ types return UNSUPPORTED_FILE_TYPE — use download."
      operationId: assignmentPreviewAttachment
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: attachmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          description: Attachment bytes for inline preview
          headers:
            Content-Disposition:
              description: inline; filename="..."; filename*=UTF-8''...
              schema:
                type: string
                example: inline; filename="brief.pdf"; filename*=UTF-8''brief.pdf
              style: simple
            Content-Type:
              description: "Stored content type, or application/octet-stream when\
                \ unknown"
              schema:
                type: string
                example: application/pdf
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNSUPPORTED_FILE_TYPE when the attachment is not PDF or image
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND or attachment NOT_FOUND
      summary: Preview an assignment attachment inline
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/{assignmentId}/due-date-change-preview:
    post:
      description: "Instructor-only dry-run. Writes nothing; reports who would become\
        \ late / need confirmation. dueAt/lateUntil are course-local wall-clock times\
        \ without Z, UTC offset, or fractional seconds."
      operationId: assignmentPreviewDueDateChange
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DueDateChangePreviewRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueDateChangePreviewApiResponse"
          description: SUCCESS
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "PARAM_MISSING, BAD_REQUEST, INVALID_LOCAL_TIME"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND
      summary: Preview due-date change impact
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/{assignmentId}/grades/release:
    post:
      description: Instructor only. Provide studentUserIds and/or groupIds. Skips
        students not in Entered state.
      operationId: assignmentReleaseGrades
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeStudentSelectionRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: PARAM_MISSING when selection is empty/invalid
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "ASSIGNMENT_NOT_FOUND, GRADE_NOT_FOUND"
      summary: Release selected grades
      tags:
      - AssignmentGrading
  /v2/courses/{courseId}/assignments/{assignmentId}/grades/release-all:
    post:
      description: Instructor only. Makes Entered grades visible to students. Idempotent.
      operationId: assignmentReleaseAllGrades
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND
      summary: Release all entered grades
      tags:
      - AssignmentGrading
  /v2/courses/{courseId}/assignments/{assignmentId}/grades/retract:
    post:
      description: Instructor only. Pulls Released grades back to Entered without
        notifying students. Provide studentUserIds and/or groupIds.
      operationId: assignmentRetractGrades
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeStudentSelectionRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: PARAM_MISSING when selection is empty/invalid
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "ASSIGNMENT_NOT_FOUND, GRADE_NOT_FOUND"
      summary: Retract selected grades
      tags:
      - AssignmentGrading
  /v2/courses/{courseId}/assignments/{assignmentId}/grading-roster:
    get:
      description: Instructor/TA with grade permission. Students and system admins
        cannot use daily grading APIs.
      operationId: assignmentGetGradingRoster
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ACCESS_DENIED or FORBIDDEN (admins cannot perform daily grading)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND
      summary: Get grading roster
      tags:
      - AssignmentGrading
  /v2/courses/{courseId}/assignments/{assignmentId}/groups/{groupId}/grade:
    put:
      description: Instructor/TA. score is required. Applies to the group submission
        target.
      operationId: assignmentUpsertGroupGrade
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertGradeRequest"
        required: true
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "PARAM_MISSING, GRADE_SCORE_OUT_OF_RANGE, BAD_REQUEST"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND
      summary: Upsert a group grade
      tags:
      - AssignmentGrading
  /v2/courses/{courseId}/assignments/{assignmentId}/groups/{groupId}/grade/annotated-file:
    get:
      description: "Instructor/TA. Returns raw bytes with Content-Disposition: attachment."
      operationId: assignmentDownloadGroupAnnotatedFile
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          description: Annotated file bytes
          headers:
            Content-Disposition:
              description: attachment; filename="..."; filename*=UTF-8''...
              schema:
                type: string
              style: simple
            Content-Type:
              description: Stored content type or application/octet-stream
              schema:
                type: string
              style: simple
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "ASSIGNMENT_NOT_FOUND, GRADE_NOT_FOUND, or annotated file NOT_FOUND"
      summary: Download annotated file for a group grade
      tags:
      - AssignmentGrading
    post:
      description: Instructor/TA. Multipart part name must be `file`.
      operationId: assignmentUploadGroupAnnotatedFile
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
        required: true
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "ASSIGNMENT_NOT_FOUND, GRADE_NOT_FOUND"
      summary: Upload annotated file for a group grade
      tags:
      - AssignmentGrading
  /v2/courses/{courseId}/assignments/{assignmentId}/groups/{groupId}/grading:
    get:
      description: Instructor/TA. Group assignment grading view for one group.
      operationId: assignmentGetGroupGradingView
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: groupId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Get grading view for a group
      tags:
      - AssignmentGrading
  /v2/courses/{courseId}/assignments/{assignmentId}/publish:
    post:
      description: "Instructor only. Requires a valid same-course weekId (Lecture)\
        \ and learningType, then makes the assignment visible to students. Published\
        \ assignments remain patchable."
      operationId: assignmentPublish
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: PARAM_MISSING or BAD_REQUEST
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND or WEEK_NOT_FOUND
      summary: Publish an assignment
      tags:
      - Assignments
  /v2/courses/{courseId}/assignments/{assignmentId}/rubric:
    get:
      description: Course members with assignment visibility. Students only see Published
        assignment rubrics; posted=false when no rubric has been uploaded.
      operationId: assignmentGetRubric
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: ASSIGNMENT_NOT_FOUND or RUBRIC_NOT_FOUND
      summary: Get current rubric pointer
      tags:
      - AssignmentRubrics
    post:
      description: "Instructor only. Multipart parts: required `file` (PDF), optional\
        \ `confirmReplaceAfterGrading` when replacing after grading has started."
      operationId: assignmentUploadRubric
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer

openapi: 3.0.1
info:
  description: Coursistant LMS REST API contract (OpenAPI 3).
  title: LMS API
  version: 1.0.0
servers:
- description: Servlet context-path
  url: /api
security:
- bearerAuth: []
tags:
- description: Reuse one CourseMaterial in multiple Lectures and Assignments without
    copying its S3 object
  name: Material links
- description: CourseWeek is the source of truth and is exposed as the Lecture content
    model
  name: Weeks / Lectures
- description: Current-user enrolled courses
  name: MeCourses
- description: "Course membership: students, TAs, members, admin enroll"
  name: Enrollment
- description: Course syllabus metadata and file stream
  name: Syllabus
- description: "Group sets, groups, and membership"
  name: Groups
- description: Course announcements
  name: Announcements
- description: Course schedule sessions
  name: Sessions
- description: Course calendar events
  name: Events
- description: Current-user upcoming course activities
  name: MeEvents
- description: "Course lifecycle, archive, and primary instructor"
  name: Courses
- description: Current-user recent announcements across courses
  name: MeAnnouncements
- description: Dated course session occurrences and attendance
  name: TeachingOccurrences
- description: Instructor/TA teaching dashboard
  name: Teaching
- description: "Course-wide Week resources; V1 has no section-scoped materials. Active\
    \ TAs may view Draft content, upload, and delete only their own uploads; they\
    \ cannot publish, unpublish, rename, move, reorder, or delete another uploader's\
    \ material."
  name: Materials
paths:
  /v2/admin/courses/{courseId}/enrollments:
    post:
      operationId: adminEnrollmentEnroll
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEnrollRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: System-admin enroll a student (legacy path)
      tags:
      - Enrollment
  /v2/admin/courses/{courseId}/enrollments/batch:
    post:
      operationId: adminEnrollmentEnrollBatch
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBatchEnrollRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: System-admin batch enroll students (legacy path)
      tags:
      - Enrollment
  /v2/admin/courses/{courseId}/enrollments/{userId}:
    delete:
      operationId: adminEnrollmentDeactivate
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: System-admin withdraw a student (legacy path)
      tags:
      - Enrollment
  /v2/advisor/instructors/{instructorUserId}/availability:
    get:
      operationId: advisorGetInstructorAvailability
      parameters:
      - in: path
        name: instructorUserId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - InstructorAvailability
  /v2/advisor/schedule-requests:
    get:
      operationId: advisorScheduleRequests
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseScheduleRequests
  /v2/advisor/schedule-requests/{requestId}/decision:
    post:
      operationId: decideAdvisorScheduleRequest
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequestDecisionRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseScheduleRequests
  /v2/advisor/students/{studentUserId}/attendance:
    get:
      operationId: advisorStudentAttendanceHistory
      parameters:
      - in: path
        name: studentUserId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: courseId
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - TeachingOccurrences
  /v2/advisor/students/{studentUserId}/courses/{courseId}/hours:
    get:
      operationId: advisorGetStudentCourseHours
      parameters:
      - in: path
        name: studentUserId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseHours
    put:
      operationId: advisorSetStudentCourseHours
      parameters:
      - in: path
        name: studentUserId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPurchasedHoursRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseHours
  /v2/advisor/students/{studentUserId}/courses/{courseId}/session-occurrences/{occurrenceId}/attendance:
    get:
      operationId: advisorGetStudentAttendance
      parameters:
      - in: path
        name: studentUserId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: occurrenceId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - TeachingOccurrences
  /v2/advisor/students/{studentUserId}/courses/{courseId}/student-reports:
    get:
      operationId: advisorListPublishedCourseReports
      parameters:
      - in: path
        name: studentUserId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseReports
  /v2/advisor/students/{studentUserId}/courses/{courseId}/student-reports/{reportId}:
    get:
      operationId: advisorGetPublishedCourseReport
      parameters:
      - in: path
        name: studentUserId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: reportId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseReports
  /v2/advisor/students/{studentUserId}/student-reports:
    get:
      operationId: advisorListStudentPublishedReports
      parameters:
      - in: path
        name: studentUserId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseReports
  /v2/courses:
    get:
      operationId: courseList
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: tenantId
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Browse/list courses with optional filters
      tags:
      - Courses
    post:
      operationId: courseCreate
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Create a course
      tags:
      - Courses
  /v2/courses/{courseId}/announcements:
    get:
      operationId: courseAnnouncementList
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: List course announcements
      tags:
      - Announcements
    post:
      operationId: courseAnnouncementCreate
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Create an announcement
      tags:
      - Announcements
  /v2/courses/{courseId}/announcements/{announcementId}:
    delete:
      description: Returns 204 No Content with an empty body on success.
      operationId: courseAnnouncementDelete
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: announcementId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: confirm
        required: false
        schema:
          type: boolean
      responses:
        "204":
          description: Announcement deleted; no response body
      summary: Delete an announcement
      tags:
      - Announcements
    get:
      operationId: courseAnnouncementGet
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: announcementId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Get an announcement by id
      tags:
      - Announcements
    patch:
      operationId: courseAnnouncementUpdate
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: announcementId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnouncementRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Update an announcement
      tags:
      - Announcements
  /v2/courses/{courseId}/assignments/{assignmentId}/materials:
    get:
      description: Students only receive Published materials whose origin Lecture
        is Published.
      operationId: courseMaterialAssignmentList
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: List materials linked to an Assignment
      tags:
      - Material links
  /v2/courses/{courseId}/discussion/posts:
    get:
      operationId: listCourseDiscussionPosts
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseDiscussion
    post:
      operationId: createCourseDiscussionPost
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: body
        required: true
        schema:
          type: string
      - in: query
        name: files
        required: false
        schema:
          type: array
          items:
            type: string
            format: binary
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiscussionPostRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: "Create a discussion post with optional file, image, or audio attachments"
      tags:
      - CourseDiscussion
  /v2/courses/{courseId}/discussion/posts/{postId}:
    get:
      operationId: getCourseDiscussionPost
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseDiscussion
  /v2/courses/{courseId}/discussion/posts/{postId}/attachments:
    get:
      operationId: listCourseDiscussionAttachments
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseDiscussion
  /v2/courses/{courseId}/discussion/posts/{postId}/attachments/{attachmentId}/download:
    get:
      operationId: downloadCourseDiscussionAttachment
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: attachmentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: OK
      summary: Download a discussion attachment as binary
      tags:
      - CourseDiscussion
  /v2/courses/{courseId}/discussion/posts/{postId}/attachments/{attachmentId}/preview:
    get:
      operationId: previewCourseDiscussionAttachment
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: attachmentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: OK
      summary: Preview a supported discussion attachment as inline binary
      tags:
      - CourseDiscussion
  /v2/courses/{courseId}/discussion/posts/{postId}/replies:
    get:
      operationId: listCourseDiscussionReplies
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      tags:
      - CourseDiscussion
    post:
      operationId: createCourseDiscussionReply
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: body
        required: true
        schema:
          type: string
      - in: query
        name: files
        required: false
        schema:
          type: array
          items:
            type: string
            format: binary
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiscussionPostRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: "Create a one-level reply with optional file, image, or audio attachments"
      tags:
      - CourseDiscussion
  /v2/courses/{courseId}/events:
    get:
      operationId: courseEventList
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: List events for a course
      tags:
      - Events
    post:
      description: date/startTime/endTime are interpreted in the course IANA timezone.
        DST gaps and overlaps are rejected with INVALID_LOCAL_TIME.
      operationId: courseEventCreate
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseEventRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Create a course event
      tags:
      - Events
  /v2/courses/{courseId}/events/{eventId}:
    delete:
      operationId: courseEventDelete
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - description: Optimistic concurrency token from the last read response
        in: query
        name: expectedVersion
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: eventId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Delete a course event
      tags:
      - Events
    get:
      operationId: courseEventGet
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: eventId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Get a course event by id
      tags:
      - Events
    put:
      description: "Partial merge: omitted or null fields are unchanged. Non-empty\
        \ values update. Empty string clears location/description. Empty name is 400.\
        \ Requires expectedVersion. The merged local time must be unambiguous in the\
        \ course IANA timezone; DST gaps/overlaps return INVALID_LOCAL_TIME."
      operationId: courseEventUpdate
      parameters:
      - description: Required idempotency key for safe retries of this mutating request
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: eventId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseEventRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: Update a course event
      tags:
      - Events
  /v2/courses/{courseId}/group-sets:
    get:
      operationId: courseGroupSetList
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: OK
      summary: List group sets for a course
      tags:
      - Groups
    post:
      operationId: courseGroupSetCreate
      parameters:
      - in: path
        name: courseId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:

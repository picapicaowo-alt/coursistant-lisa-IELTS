components:
  schemas:
    AdminBatchEnrollRequest:
      type: object
      description: Batch enroll students by userIds and/or emails
      properties:
        emails:
          type: array
          items:
            type: string
        userIds:
          type: array
          items:
            type: integer
            format: int32
    AdminEnrollRequest:
      type: object
      description: Enroll a single user by userId (student or TA)
      properties:
        userId:
          type: integer
          format: int32
    ApiResponse:
      type: object
      description: Unified JSON envelope for LMS APIs
      properties:
        code:
          type: string
          description: Stable machine code (ErrorType.name() or SUCCESS)
          example: SUCCESS
        data:
          $ref: "#/components/schemas/TenantAlertRuleResponse"
        message:
          type: string
          description: Human-readable message
          example: Success
        status:
          type: integer
          format: int32
          description: HTTP status mirrored in body
          example: 200
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp
          example: 2026-07-23T10:00:00Z
    AssignMemberRequest:
      type: object
      properties:
        confirmAcademicImpact:
          type: boolean
        confirmCapacityOverfill:
          type: boolean
        userId:
          type: integer
          format: int32
    AttendanceEntryRequest:
      type: object
      properties:
        status:
          type: string
        studentUserId:
          type: integer
          format: int32
    AvailabilityExceptionRequest:

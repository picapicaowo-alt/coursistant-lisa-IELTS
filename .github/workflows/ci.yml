name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: lms

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lms/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run typecheck:production
      - run: npm run typecheck:i18n
      - run: npm run test:i18n-tools
      - run: npm run i18n:keys
      - run: npm run i18n:check
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
